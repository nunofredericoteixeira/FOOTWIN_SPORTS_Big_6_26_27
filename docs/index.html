
<!doctype html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FOOTWIN SPORTS — Prognósticos</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #07111f;
            --panel: #101d2f;
            --panel-2: #16263c;
            --text: #f4f7fb;
            --muted: #9fb0c6;
            --accent: #36c98f;
            --border: #263b57;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top right, #123b50 0, transparent 35%),
                linear-gradient(160deg, #050b14, var(--bg));
            color: var(--text);
            font-family: Inter, Arial, sans-serif;
        }

        .container {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 38px 0 60px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 24px;
            margin-bottom: 28px;
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 5vw, 48px);
            letter-spacing: -1.5px;
        }

        .subtitle,
        .updated {
            color: var(--muted);
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .summary-card,
        .match-card {
            background: rgba(16, 29, 47, 0.92);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.22);
        }

        .summary-card {
            padding: 20px;
        }

        .summary-card span {
            display: block;
            color: var(--muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.9px;
        }

        .summary-card strong {
            display: block;
            margin-top: 8px;
            font-size: 27px;
        }

        .matches {
            display: grid;
            gap: 16px;
        }

        .match-card {
            padding: 22px;
        }

        .match-top {
            display: flex;
            justify-content: space-between;
            gap: 18px;
            align-items: center;
            margin-bottom: 18px;
        }

        .teams {
            font-size: 21px;
            font-weight: 750;
        }

        .date {
            color: var(--muted);
            font-size: 14px;
            white-space: nowrap;
        }

        .probabilities {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .probability {
            padding: 14px;
            background: var(--panel-2);
            border-radius: 13px;
            text-align: center;
        }

        .probability span {
            display: block;
            color: var(--muted);
            font-size: 13px;
        }

        .probability strong {
            display: block;
            margin-top: 6px;
            font-size: 21px;
        }

        .prediction {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin-top: 17px;
            padding-top: 17px;
            border-top: 1px solid var(--border);
        }

        .badge {
            display: inline-flex;
            min-width: 48px;
            min-height: 42px;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            border-radius: 12px;
            background: var(--accent);
            color: #042116;
            font-size: 21px;
            font-weight: 900;
        }

        .score {
            color: var(--muted);
        }

        .empty {
            padding: 40px;
            text-align: center;
            background: var(--panel);
            border-radius: 18px;
            color: var(--muted);
        }

        @media (max-width: 720px) {
            header,
            .match-top,
            .prediction {
                align-items: flex-start;
                flex-direction: column;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .probabilities {
                gap: 8px;
            }

            .match-card {
                padding: 17px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div>
            <div class="subtitle">FOOTWIN SPORTS</div>
            <h1>Prognósticos POR1</h1>
        </div>
        <div class="updated">Atualizado: Sem registo</div>
    </header>

    
        <div class="empty">Não existem prognósticos disponíveis para a próxima jornada.</div>
    
</div>
</body>
</html>
